version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: nhanes_backend
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app
      # 排除虚拟环境和临时文件
      - /app/__pycache__
      - /app/.pytest_cache
    environment:
      - FLASK_APP=get.py
      - FLASK_ENV=development
      - FLASK_PORT=5000
      - HOST=0.0.0.0
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nhanes_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
