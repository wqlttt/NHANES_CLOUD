version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nhanes_backend
    ports:
      - "5001:5000"
    environment:
      - FLASK_APP=get.py
      - FLASK_ENV=production
      - FLASK_PORT=5000
      - NHANES_DATA_PATH=/data
      - HOST=0.0.0.0
    volumes:
      - ./backend:/app
      - /root/NHANES_DATA/DATA:/data
      # 排除虚拟环境和临时文件
      - /app/__pycache__
      - /app/.pytest_cache
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nhanes_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
    restart: unless-stopped
